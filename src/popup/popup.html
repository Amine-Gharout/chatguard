<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGuard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>ChatGuard</h1>
      <span class="subtitle">Send-nudge prototype · CDH demo</span>
    </header>

    <label class="row master">
      <span>Enable nudges</span>
      <input type="checkbox" id="master-toggle" />
    </label>

    <label class="row">
      <span>AI classifier (DeepSeek)</span>
      <input type="checkbox" id="llm-toggle" />
    </label>

    <fieldset>
      <legend>Warn about</legend>
      <div id="category-list"></div>
    </fieldset>

    <fieldset>
      <legend>DeepSeek API key (stored locally)</legend>
      <input type="password" id="api-key" class="key-input" placeholder="sk-…" autocomplete="off" spellcheck="false" />
      <p class="footnote">Optional. When the AI classifier is on, your message text is sent to DeepSeek for classification.</p>
    </fieldset>

    <p class="footnote">Rule-based detection is local. Nothing is stored or logged.</p>

    <script src="../shared/settings.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/detector.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
